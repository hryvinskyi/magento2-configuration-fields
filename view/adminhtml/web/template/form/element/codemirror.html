<div class="hui-tokens hcf-code" data-role="hcf-code" data-bind="attr: {'data-disabled': disabled() ? 'true' : false}">
    <textarea class="admin__control-textarea codemirror-textarea" data-bind="
        value: value,
        hasFocus: focused,
        attr: {
            name: inputName,
            id: uid,
            disabled: disabled,
            'aria-describedby': noticeId,
            placeholder: placeholder
        }"
        afterRender="initEditor">
    </textarea>
</div>
